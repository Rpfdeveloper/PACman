sourceCompatibility = 17
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/main/java" ]
sourceSets.test.java.srcDirs = [ "src/test/java" ]
sourceSets.test.resources.srcDirs = [ "src/test/resources" ]

// Custom tagged Test tasks must execute the same compiled tests and resources.
tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

eclipse.project.name = appName + "-core"

task testSanity(type: Test) {
    group = "Verification"
    useJUnitPlatform {
        includeTags "sanity"
    }
}

task testBasic(type: Test) {
    group = "Verification"
    useJUnitPlatform {
        includeTags "basic"
    }
}

task testSanityBasic(type: Test) {
    group = "Verification"
    useJUnitPlatform {
        includeTags "sanity", "basic"
    }
}

task testAdvanced(type: Test) {
    group = "Verification"
    useJUnitPlatform {
        includeTags "advanced"
    }
}

task testExpert(type: Test) {
    group = "Verification"
    useJUnitPlatform {
        includeTags "expert"
    }
}

javadoc {
    source = sourceSets.main.allJava
    options.memberLevel = JavadocMemberLevel.PRIVATE
    destinationDir = layout.buildDirectory.dir("docs/javadoc").get().asFile
}